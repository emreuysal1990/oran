<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Benzer Oran Bülteni</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Düzen: başlıkta Güncelle tuşu; Gelecek / Geçmiş sekmeleri; filtre çubuğu (tarih, lig, pazar, sıralama); iddaa bülteni gibi maç satırları, açılınca tüm pazarlar ve benzer maçlar; üstte sinyal ayarları, altta backtest. */
:root {
  --bg: #eef2ef; --surface: #ffffff; --surface-2: #f6f8f6; --ink: #142019; --muted: #5a6a61; --line: #d6dfd8;
  --accent: #0b5d7a; --accent-soft: #e2eff4; --signal: #c98a06; --signal-soft: #fdf3dc;
  --hit: #1c8a55; --hit-soft: #e3f4ea; --miss: #c2410c; --miss-soft: #fbe9e1; --on-accent: #ffffff; --est: #7a4fb0;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1411; --surface: #151d19; --surface-2: #1a241f; --ink: #e5ece8; --muted: #95a59c; --line: #26332c;
  --accent: #62b6d3; --accent-soft: #15303a; --signal: #f0b43c; --signal-soft: #3a2d10;
  --hit: #4cc38a; --hit-soft: #133224; --miss: #f08158; --miss-soft: #3a1d12; --on-accent: #0e1411; --est: #c3a1ef; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1411; --surface: #151d19; --surface-2: #1a241f; --ink: #e5ece8; --muted: #95a59c; --line: #26332c;
  --accent: #62b6d3; --accent-soft: #15303a; --signal: #f0b43c; --signal-soft: #3a2d10;
  --hit: #4cc38a; --hit-soft: #133224; --miss: #f08158; --miss-soft: #3a1d12; --on-accent: #0e1411; --est: #c3a1ef; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1160px; margin: 0 auto; padding-block: 24px 64px; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h1 { font-size: 2.4rem; line-height: 1; text-transform: uppercase; }
h2 { font-size: 1.5rem; text-transform: uppercase; }
a { color: var(--accent); }
.muted { color: var(--muted); }
header.top { display: grid; gap: 10px; }
.hrow { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.upd { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.upd-durum { font-size: 13px; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 13px; }
.meta b { color: var(--ink); font-weight: 600; }
.btn { font: inherit; font-weight: 600; color: var(--on-accent); background: var(--accent); border: 0; border-radius: 6px; padding: 9px 18px; cursor: pointer; }
.btn[disabled] { opacity: .6; cursor: progress; }
.btn:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); justify-self: start; }
.tabs button { font: inherit; font-family: var(--f-display); font-size: 1.05rem; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); background: transparent; border: 0; padding: 8px 18px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.tabs button span { font-family: var(--f-mono); font-size: 12px; margin-left: 4px; }
.bar { background: var(--bg); padding-block: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: end; border-bottom: 1px solid var(--line); }
@media (min-width: 900px) { .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; } }
.bar label { display: grid; gap: 2px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.bar select, .bar input { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; max-width: 100%; text-transform: none; letter-spacing: 0; }
.bar .grow { flex: 1 1 160px; }
.bar .grow input { width: 100%; }
.bar .chk { display: inline-flex; grid-auto-flow: column; gap: 6px; align-items: center; font-size: 13px; color: var(--ink); text-transform: none; letter-spacing: 0; padding-bottom: 7px; }
.count { margin-left: auto; color: var(--muted); font-size: 13px; padding-bottom: 7px; }
.banner { background: var(--accent-soft); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 13px; }
.day h3 { font-size: 1.15rem; text-transform: uppercase; color: var(--muted); padding: 14px 2px 6px; }
.list { display: grid; gap: 6px; }
.fx { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.fx > button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; align-items: center; gap: 6px 14px;
  grid-template-columns: 58px 50px minmax(0, 1fr) auto auto auto 16px; padding: 10px 12px; }
.fx > button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 8px; }
.time { font-family: var(--f-mono); font-size: 13px; line-height: 1.25; }
.time small { display: block; color: var(--muted); font-size: 11px; }
.lg { font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .04em; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 1px 6px; justify-self: start; }
.teams { min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.teams .res { font-family: var(--f-mono); font-weight: 500; margin-left: 8px; color: var(--muted); white-space: nowrap; }
.odds { display: flex; gap: 4px; }
.odd { font-family: var(--f-mono); font-size: 13px; min-width: 46px; text-align: center; padding: 3px 4px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); }
.odd small { display: block; font-size: 10px; color: var(--muted); font-family: var(--f-body); }
.pick { font-size: 12px; border: 1px dashed var(--est); border-radius: 6px; padding: 3px 8px; display: grid; line-height: 1.3; min-width: 120px; }
.pick b { font-family: var(--f-mono); font-weight: 500; font-size: 13px; }
.pick .e { color: var(--est); font-family: var(--f-mono); }
.pick.hit { border-style: solid; border-color: var(--hit); background: var(--hit-soft); }
.pick.miss { border-style: solid; border-color: var(--miss); background: var(--miss-soft); }
.pick-bos { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; max-width: 260px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--signal-soft); color: var(--ink); border: 1px solid var(--signal); white-space: nowrap; }
.chip.hit { background: var(--hit-soft); border-color: var(--hit); }
.chip.miss { background: var(--miss-soft); border-color: var(--miss); }
.chip.none { background: transparent; border-color: var(--line); color: var(--muted); }
.caret { color: var(--muted); transition: transform .15s; }
.fx.open .caret { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) { .caret { transition: none; } }
.fx:not(.open) > .detail { display: none; }
.detail { border-top: 1px solid var(--line); padding: 12px; display: grid; gap: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legend .e { color: var(--est); font-weight: 600; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.n, th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
td.est { color: var(--est); }
tr.grp td { font-family: var(--f-display); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--surface-2); padding-top: 8px; }
tr.sig td:first-child { box-shadow: inset 3px 0 0 var(--signal); }
.mk { display: inline-block; padding: 0 4px; border-radius: 3px; }
.mk.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.ok { color: var(--hit); font-weight: 600; }
.no { color: var(--miss); font-weight: 600; }
.empty { padding: 24px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; }
.panel h2 { font-size: 1.2rem; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.ayar-ozet { margin: 0; font-size: 13px; color: var(--muted); }
.ayar-ozet b { color: var(--ink); font-weight: 600; }
.form label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.form select { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; min-width: 0; }
section.bt { display: grid; gap: 12px; }
.bt .lead { max-width: 75ch; margin: 0; }
.bt table td.good { color: var(--hit); font-weight: 600; }
.bt table td.bad { color: var(--miss); font-weight: 600; }
.bt-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.foot { font-size: 12px; color: var(--muted); max-width: 80ch; display: grid; gap: 6px; }
.foot p { margin: 0; }
@media (max-width: 820px) {
  .fx > button { grid-template-columns: 50px 46px minmax(0, 1fr) 16px; }
  .fx > button .odds, .fx > button .pick, .fx > button .chips { grid-column: 1 / -1; }
  .fx > button .chips { justify-content: flex-start; max-width: none; }
  .fx > button .caret { grid-row: 1; grid-column: 4; }
  h1 { font-size: 1.9rem; }
}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="hrow">
      <h1>Benzer Oran Bülteni</h1>
      <div class="upd"><span class="upd-durum" id="upd-durum"></span><button class="btn" type="button" id="guncelle">Güncelle</button></div>
    </div>
    <div class="meta" id="meta"><span>Veri yükleniyor…</span></div>
  </header>

  <section class="panel" id="ayarlar" aria-labelledby="ayar-baslik">
    <h2 id="ayar-baslik">Sinyal ayarları</h2>
    <div class="form">
      <label for="a-tol">Benzerlik toleransı
        <select id="a-tol"><option value="0.015">±1,5 puan</option><option value="0.02">±2 puan</option><option value="0.025">±2,5 puan</option><option value="0.03">±3 puan</option><option value="0.04">±4 puan</option><option value="0.05">±5 puan</option></select></label>
      <label for="a-max">En yakın kaç maç
        <select id="a-max"><option>5</option><option>8</option><option>10</option><option>15</option><option>20</option><option>30</option></select></label>
      <label for="a-min">Sinyal için en az maç
        <select id="a-min"><option>3</option><option>4</option><option>5</option><option>6</option><option>8</option><option>10</option></select></label>
      <label for="a-esik">Sinyal eşiği
        <select id="a-esik"><option value="1">%100 (hepsi tuttu)</option><option value="0.9">%90</option><option value="0.8">%80</option></select></label>
    </div>
    <p class="ayar-ozet" id="ayar-ozet"></p>
  </section>

  <div class="tabs" role="tablist" aria-label="Maçlar">
    <button type="button" role="tab" id="tab-g" aria-selected="true">Gelecek maçlar<span id="n-g"></span></button>
    <button type="button" role="tab" id="tab-p" aria-selected="false">Geçmiş maçlar<span id="n-p"></span></button>
  </div>

  <div class="bar">
    <label for="f-hizli">Tarih
      <select id="f-hizli"></select></label>
    <label for="f-bas">Başlangıç <input type="date" id="f-bas"></label>
    <label for="f-bit">Bitiş <input type="date" id="f-bit"></label>
    <label for="f-lig">Lig <select id="f-lig"></select></label>
    <label for="f-pazar">Pazar <select id="f-pazar"></select></label>
    <label for="f-sira">Sıralama <select id="f-sira"><option value="tarih">Tarih</option><option value="ihtimal">Seçili pazarın ihtimali</option></select></label>
    <label for="f-ara" class="grow">Takım <input id="f-ara" type="search" placeholder="Takım ara"></label>
    <label class="chk"><input id="f-sinyal" type="checkbox"> Sadece sinyalli</label>
    <span class="count" id="f-count"></span>
  </div>
  <div class="banner" id="banner" hidden></div>
  <div id="fixtures"><div class="empty">Veri yükleniyor…</div></div>


  <section class="bt">
    <h2>Sistem geçmişte nasıl çalıştı?</h2>
    <p class="lead" id="bt-lead">Backtest veriler yüklenince hesaplanacak.</p>
    <div class="bt-wrap scroll"><table id="bt-table"></table></div>
    <div class="bt-wrap scroll"><table id="bt-lig"></table></div>
  </section>

  <footer class="foot" id="foot"></footer>
</div>
<script>
(function () {
  "use strict";
  const LIGLER = {
    E0: "İngiltere Premier Lig", E1: "İngiltere Championship", E2: "İngiltere League One", E3: "İngiltere League Two",
    EC: "İngiltere National League", SC0: "İskoçya Premiership", SC1: "İskoçya Championship", SC2: "İskoçya League One",
    SC3: "İskoçya League Two", D1: "Almanya Bundesliga", D2: "Almanya 2. Bundesliga", I1: "İtalya Serie A", I2: "İtalya Serie B",
    SP1: "İspanya La Liga", SP2: "İspanya La Liga 2", F1: "Fransa Ligue 1", F2: "Fransa Ligue 2", N1: "Hollanda Eredivisie",
    B1: "Belçika Pro Lig", P1: "Portekiz Liga", T1: "Türkiye Süper Lig", G1: "Yunanistan Süper Lig"
  };
  const g = m => m.ms[0] + m.ms[1];
  // [kod, etiket, grup, gereken alan, test, Bet365 oran alanı]
  const PAZARLAR = [
    ["MS1", "MS 1", "Maç sonucu", "ms", m => m.ms[0] > m.ms[1], "o1"],
    ["MSX", "MS X", "Maç sonucu", "ms", m => m.ms[0] === m.ms[1], "ox"],
    ["MS2", "MS 2", "Maç sonucu", "ms", m => m.ms[0] < m.ms[1], "o2"],
    ["CS1X", "Çifte şans 1X", "Maç sonucu", "ms", m => m.ms[0] >= m.ms[1]],
    ["CSX2", "Çifte şans X2", "Maç sonucu", "ms", m => m.ms[0] <= m.ms[1]],
    ["CS12", "Çifte şans 12", "Maç sonucu", "ms", m => m.ms[0] !== m.ms[1]],
    ["U15", "1,5 Üst", "Toplam gol", "ms", m => g(m) >= 2],
    ["A15", "1,5 Alt", "Toplam gol", "ms", m => g(m) <= 1],
    ["U25", "2,5 Üst", "Toplam gol", "ms", m => g(m) >= 3, "ou"],
    ["A25", "2,5 Alt", "Toplam gol", "ms", m => g(m) <= 2, "oa"],
    ["U35", "3,5 Üst", "Toplam gol", "ms", m => g(m) >= 4],
    ["A35", "3,5 Alt", "Toplam gol", "ms", m => g(m) <= 3],
    ["U45", "4,5 Üst", "Toplam gol", "ms", m => g(m) >= 5],
    ["A45", "4,5 Alt", "Toplam gol", "ms", m => g(m) <= 4],
    ["KGV", "KG Var", "Karşılıklı gol", "ms", m => m.ms[0] > 0 && m.ms[1] > 0],
    ["KGY", "KG Yok", "Karşılıklı gol", "ms", m => m.ms[0] === 0 || m.ms[1] === 0],
    ["EV05U", "Ev 0,5 Üst", "Ev sahibi golü", "ms", m => m.ms[0] >= 1],
    ["EV05A", "Ev 0,5 Alt", "Ev sahibi golü", "ms", m => m.ms[0] === 0],
    ["EV15U", "Ev 1,5 Üst", "Ev sahibi golü", "ms", m => m.ms[0] >= 2],
    ["EV15A", "Ev 1,5 Alt", "Ev sahibi golü", "ms", m => m.ms[0] <= 1],
    ["EV25U", "Ev 2,5 Üst", "Ev sahibi golü", "ms", m => m.ms[0] >= 3],
    ["DEP05U", "Dep 0,5 Üst", "Deplasman golü", "ms", m => m.ms[1] >= 1],
    ["DEP05A", "Dep 0,5 Alt", "Deplasman golü", "ms", m => m.ms[1] === 0],
    ["DEP15U", "Dep 1,5 Üst", "Deplasman golü", "ms", m => m.ms[1] >= 2],
    ["DEP15A", "Dep 1,5 Alt", "Deplasman golü", "ms", m => m.ms[1] <= 1],
    ["DEP25U", "Dep 2,5 Üst", "Deplasman golü", "ms", m => m.ms[1] >= 3],
    ["IY1", "İY 1", "İlk yarı", "iy", m => m.iy[0] > m.iy[1]],
    ["IYX", "İY X", "İlk yarı", "iy", m => m.iy[0] === m.iy[1]],
    ["IY2", "İY 2", "İlk yarı", "iy", m => m.iy[0] < m.iy[1]],
    ["IY05U", "İY 0,5 Üst", "İlk yarı", "iy", m => m.iy[0] + m.iy[1] >= 1],
    ["IY05A", "İY 0,5 Alt", "İlk yarı", "iy", m => m.iy[0] + m.iy[1] === 0],
    ["IY15U", "İY 1,5 Üst", "İlk yarı", "iy", m => m.iy[0] + m.iy[1] >= 2],
    ["IY15A", "İY 1,5 Alt", "İlk yarı", "iy", m => m.iy[0] + m.iy[1] <= 1],
    ["IYKGV", "İY KG Var", "İlk yarı", "iy", m => m.iy[0] > 0 && m.iy[1] > 0],
    ["IY2Y05U", "2. yarı 0,5 Üst", "İkinci yarı", "iy", m => g(m) - m.iy[0] - m.iy[1] >= 1],
    ["IY2Y15U", "2. yarı 1,5 Üst", "İkinci yarı", "iy", m => g(m) - m.iy[0] - m.iy[1] >= 2],
    ["K75U", "Korner 7,5 Üst", "Korner", "korner", m => m.korner >= 8],
    ["K85U", "Korner 8,5 Üst", "Korner", "korner", m => m.korner >= 9],
    ["K85A", "Korner 8,5 Alt", "Korner", "korner", m => m.korner <= 8],
    ["K95U", "Korner 9,5 Üst", "Korner", "korner", m => m.korner >= 10],
    ["K95A", "Korner 9,5 Alt", "Korner", "korner", m => m.korner <= 9],
    ["K105U", "Korner 10,5 Üst", "Korner", "korner", m => m.korner >= 11],
    ["K105A", "Korner 10,5 Alt", "Korner", "korner", m => m.korner <= 10],
    ["K115A", "Korner 11,5 Alt", "Korner", "korner", m => m.korner <= 11],
    ["C25U", "Kart 2,5 Üst", "Kart", "kart", m => m.kart >= 3],
    ["C35U", "Kart 3,5 Üst", "Kart", "kart", m => m.kart >= 4],
    ["C35A", "Kart 3,5 Alt", "Kart", "kart", m => m.kart <= 3],
    ["C45U", "Kart 4,5 Üst", "Kart", "kart", m => m.kart >= 5],
    ["C45A", "Kart 4,5 Alt", "Kart", "kart", m => m.kart <= 4],
    ["C55U", "Kart 5,5 Üst", "Kart", "kart", m => m.kart >= 6],
    ["C55A", "Kart 5,5 Alt", "Kart", "kart", m => m.kart <= 5]
  ];
  const PZ = {}; PAZARLAR.forEach((p, i) => PZ[p[0]] = { label: p[1], grup: p[2], i });
  const sonucu = (pz, m) => (m[pz[3]] == null ? null : !!pz[4](m));

  // ---------------------------------------------------------------- tarih
  const GMS = 864e5;
  const gunNo = (y, mo, d) => Math.round(Date.UTC(y, mo - 1, d) / GMS);
  const bugun = (() => { const n = new Date(); return gunNo(n.getFullYear(), n.getMonth() + 1, n.getDate()); })();
  const tOf = gn => new Date(gn * GMS);
  const iso = gn => tOf(gn).toISOString().slice(0, 10);
  const isoGun = s => { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return gunNo(y, m, d); };
  const GUN = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
  const AY = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
  const uzunTarih = gn => { const d = tOf(gn); return d.getUTCDate() + " " + AY[d.getUTCMonth()] + " " + GUN[d.getUTCDay()]; };
  const kisaTarih = gn => { const d = tOf(gn); return String(d.getUTCDate()).padStart(2, "0") + "." + String(d.getUTCMonth() + 1).padStart(2, "0") + "." + String(d.getUTCFullYear()).slice(2); };
  const sezonBasi = gn => { const d = tOf(gn); const y = d.getUTCMonth() >= 6 ? d.getUTCFullYear() : d.getUTCFullYear() - 1; return gunNo(y, 7, 1); };

  // ---------------------------------------------------------------- veri
  function mac(lig, gun, saat, ev, dep, o1, ox, o2, ou, oa, ms, iy, korner, kart) {
    const s = 1 / o1 + 1 / ox + 1 / o2;
    const m = { lig, gun, saat: saat || "", ev, dep, o1, ox, o2, ou: ou || null, oa: oa || null,
      p1: (1 / o1) / s, px: (1 / ox) / s, p2: (1 / o2) / s, pu: null, ms: ms || null, iy: iy || null,
      korner: korner == null ? null : korner, kart: kart == null ? null : kart };
    if (ou && oa) { const su = 1 / ou + 1 / oa; m.pu = (1 / ou) / su; }

  }
  let TUM = [], GRUP = {}, FIK = [], SON_GUN = 0, ILK_GUN = 0, OLUSTURMA = null;
  function veriAc(V) {
    const T = V.takim, L = V.lig, o = x => x ? x / 100 : null;
    TUM = V.m.map(r => mac(L[r[0]], r[1], r[2], T[r[3]], T[r[4]], r[11] / 100, r[12] / 100, r[13] / 100, o(r[14]), o(r[15]),
      [r[5], r[6]], r[7] == null ? null : [r[7], r[8]], r[9], r[10]));
    FIK = (V.f || []).map(r => mac(L[r[0]], r[1], r[2], T[r[3]], T[r[4]], r[5] / 100, r[6] / 100, r[7] / 100, o(r[8]), o(r[9])));

    Object.values(GRUP).forEach(l => l.sort((a, b) => a.gun - b.gun || a.saat.localeCompare(b.saat)));
    SON_GUN = TUM.reduce((a, m) => Math.max(a, m.gun), 0);

  // Her lig için pazar bazında birikimli sayılar: herhangi bir tarihe kadarki lig ortalamasını hızlı vermek için.
  let ONEK = {};
  const P = PAZARLAR.length;
  function onekHazirla() {
    ONEK = {};
    for (const [lk, l] of Object.entries(GRUP)) {
      const N = l.length, n = new Int32Array((N + 1) * P), h = new Int32Array((N + 1) * P);
      for (let i = 0; i < N; i++) for (let k = 0; k < P; k++) {
        const s = sonucu(PAZARLAR[k], l[i]);
        n[(i + 1) * P + k] = n[i * P + k] + (s == null ? 0 : 1); h[(i + 1) * P + k] = h[i * P + k] + (s ? 1 : 0);

    }
  }
  function ligOrt(lk, bitis, k) { const o = ONEK[lk]; if (!o) return null; const n = o.n[bitis * P + k]; return n ? o.h[bitis * P + k] / n : null; }
  const ONCUL = 8; // az veride tahmini lig ortalamasına çeken ağırlık

  // ---------------------------------------------------------------- analiz
  function mesafe(t, c, tol) {
    const d1 = Math.abs(t.p1 - c.p1), d2 = Math.abs(t.p2 - c.p2);
    if (d1 > tol || d2 > tol) return -1;
    let d = Math.max(d1, d2, Math.abs(t.px - c.px));
    if (t.pu != null) { if (c.pu == null) return -1; const du = Math.abs(t.pu - c.pu); if (du > tol) return -1; d = Math.max(d, du); }
    return d;
  }
  function analiz(t, liste, bitis, A) {
    const yakin = [], genis = [], tol = A.tol, tol2 = A.tol * 2;
    for (let i = 0; i < bitis; i++) {
      const c = liste[i]; const d = mesafe(t, c, tol2);
      if (d < 0) continue;
      genis.push(c); if (d <= tol) yakin.push([d, c]);
    }
    yakin.sort((a, b) => a[0] - b[0] || b[1].gun - a[1].gun);
    const benzer = yakin.slice(0, A.max).map(x => x[1]);
    const sec = new Set(benzer);
    const dis = genis.filter(c => !sec.has(c));
    const pazar = PAZARLAR.map((pz, k) => {
      let n = 0, h = 0; for (const c of benzer) { const s = sonucu(pz, c); if (s != null) { n++; h += s; } }
      let gn = 0, gh = 0; for (const c of dis) { const s = sonucu(pz, c); if (s != null) { gn++; gh += s; } }
      const tn = n + gn, lo = ligOrt(t.lig, bitis, k);

    return { benzer, pazar };
  }

  function backtest(A) {
    const testBas = gunNo(tOf(sezonBasi(ILK_GUN)).getUTCFullYear() + 1, 7, 1);
    const top = {}; PAZARLAR.forEach(p => top[p[0]] = { s: 0, t: 0, nt: 0, pt: 0, pn: 0, kar: 0, on: 0, tn: 0, th: 0 });
    const lig = {}; let testMac = 0;
    for (const [lk, liste] of Object.entries(GRUP)) {

        if (!i0) continue;

          const oran = pz[5] ? t[pz[5]] : null;

        normal: a.s ? a.nt / a.s : null, genel: a.tn ? a.th / a.tn : null, piyasa: a.pn ? a.pt / a.pn : null, oranli: a.on, kar: a.on ? a.kar : null }; }),

  }

  function hizliUygula(k) {

  function ciz() {
    const lig = $("f-lig").value, ara = $("f-ara").value.trim().toLocaleLowerCase("tr"), sadece = $("f-sinyal").checked;
    let liste = VIEW.filter(v => (!lig || v.t.lig === lig) && (!ara || (v.t.ev + " " + v.t.dep).toLocaleLowerCase("tr").includes(ara)) &&
      (!sadece || v.pazar.some(p => p.sinyal)));
    const ihtimal = F.sira === "ihtimal" && F.pazar;
    if (ihtimal) { const k = PZ[F.pazar].i; liste = liste.slice().sort((a, b) => (b.pazar[k].tah ?? -1) - (a.pazar[k].tah ?? -1)); }
    else liste = liste.slice().sort((a, b) => b.t.gun === a.t.gun ? a.t.saat.localeCompare(b.t.saat) || a.t.lig.localeCompare(b.t.lig) : (gorunum === "p" ? b.t.gun - a.t.gun : a.t.gun - b.t.gun));
    const kap = $("fixtures"); kap.textContent = "";
    $("f-count").textContent = binlik(liste.length) + " / " + binlik(VIEW.length) + " maç";
    if (!TUM.length) { kap.append(el("div", "empty", "Veri yüklenemedi. Güncelle tuşuna basın.")); return; }
    if (!VIEW.length) {
      kap.append(el("div", "empty", gorunum === "g"
        ? (FIK.some(m => m.gun >= bugun) ? "Seçili tarih aralığında oranı açıklanmış maç yok." :
          "Şu an oranı açıklanmış gelecek maç yok. football-data.co.uk hafta sonu maçlarını Cuma, hafta içi maçlarını Salı öğleden sonra yayınlıyor; sayfa bunları otomatik alır. Bu arada Geçmiş maçlar sekmesine bakabilirsiniz.")
        : "Seçili tarih aralığında maç yok.")); return;
    }
    if (!liste.length) { kap.append(el("div", "empty", "Bu filtreyle maç yok.")); return; }
    const MAX = 400; const gos = liste.slice(0, MAX);
    if (ihtimal) { const l = el("div", "list"); gos.forEach(v => l.append(fxSatir(v, true))); kap.append(l); }
    else {
      let gun = null, lst = null;
      gos.forEach(v => {
        if (v.t.gun !== gun) { gun = v.t.gun; const d = el("div", "day"); d.append(el("h3", null, uzunTarih(gun))); lst = el("div", "list"); d.append(lst); kap.append(d); }
        lst.append(fxSatir(v, false));
      });
    }
    if (liste.length > MAX) kap.append(el("div", "empty", "İlk " + MAX + " maç gösteriliyor. Tarih aralığını daraltın ya da lig seçin."));
  }

  // ---------------------------------------------------------------- backtest
  let btNo = 0;
  function btBaslat() {
    const no = ++btNo; $("bt-lead").textContent = "Backtest hesaplanıyor…";
    setTimeout(() => { if (no !== btNo || !TUM.length) return; btCiz(backtest(A)); }, 60);
  }
  function btCiz(B) {
    const sat = B.satirlar.filter(r => r.sinyal > 0);
    const top = sat.reduce((a, r) => (a.s += r.sinyal, a.t += r.tuttu, a.n += r.normal * r.sinyal, a), { s: 0, t: 0, n: 0 });
    const or = sat.filter(r => r.oranli > 0);
    const kar = or.reduce((a, r) => a + r.kar, 0), oranliN = or.reduce((a, r) => a + r.oranli, 0);
    $("bt-lead").textContent = top.s
      ? kisaTarih(B.baslangic) + " sonrasındaki " + binlik(B.testMac) + " maçta, her maç sadece kendinden önce oynanmış maçlarla analiz edildi. " +
        "Toplam " + binlik(top.s) + " sinyal çıktı; tutma oranı " + yuzde(top.t / top.s) + ". Aynı pazarların, sinyali üreten maçlar dışındaki benzer oranlı maçlardaki normal tutma oranı ise " + yuzde(top.n / top.s) + ". " +
        (oranliN ? "Bet365 oranı bilinen pazarlarda (MS ve 2,5 Alt/Üst) her sinyale 1 birim konsaydı sonuç " + (kar >= 0 ? "+" : "") + virgul(kar) + " birim olurdu (" + binlik(oranliN) + " sinyal)." : "")
      : "Bu ayarlarla geçmişte sinyal çıkmadı.";
    const bt = $("bt-table"); bt.textContent = "";
    const bh = bt.createTHead().insertRow();
    ["Pazar", "Sinyal", "Tuttu", "Tutma", "Grubun normali", "Fark", "Tüm maçlarda", "Piyasa ihtimali", "Kâr/zarar (birim)"].forEach((x, i) => bh.append(el("th", i ? "n" : null, x)));
    const bb = bt.createTBody();
    sat.sort((a, b) => b.sinyal - a.sinyal).forEach(r => {
      const tr = bb.insertRow(); tr.insertCell().textContent = PZ[r.kod].label;
      const add = (t, cls) => { const c = tr.insertCell(); c.className = "n" + (cls ? " " + cls : ""); c.textContent = t; };
      add(binlik(r.sinyal)); add(binlik(r.tuttu)); add(yuzde(r.oran)); add(yuzde(r.normal));
      const fark = r.oran - r.normal; add((fark >= 0 ? "+" : "") + Math.round(fark * 100) + " puan", fark > 0.02 ? "good" : fark < -0.02 ? "bad" : "");
      add(yuzde(r.genel)); add(r.piyasa == null ? "–" : yuzde(r.piyasa));
      add(r.kar == null ? "–" : (r.kar >= 0 ? "+" : "") + virgul(r.kar), r.kar == null ? "" : r.kar > 0 ? "good" : "bad");
    });
    const lt = $("bt-lig"); lt.textContent = "";
    const lh = lt.createTHead().insertRow();
    ["Lig", "Sinyal", "Tuttu", "Tutma", "Grubun normali"].forEach((x, i) => lh.append(el("th", i ? "n" : null, x)));
    const lb = lt.createTBody();
    B.ligler.slice().sort((a, b) => b.sinyal - a.sinyal).forEach(r => {
      const tr = lb.insertRow(); tr.insertCell().textContent = LIGLER[r.lig] || r.lig;
      [binlik(r.sinyal), binlik(r.tuttu), yuzde(r.oran), yuzde(r.normal)].forEach(t => { const c = tr.insertCell(); c.className = "n"; c.textContent = t; });
    });
  }

  // ---------------------------------------------------------------- üst bilgi + güncelleme
  function metaCiz() {
    const meta = $("meta"); meta.textContent = "";
    const fs = FIK.filter(m => m.gun >= bugun).length;
    [["Kaynak", "football-data.co.uk"], ["Geçmiş", binlik(TUM.length) + " maç"], ["Aralık", TUM.length ? kisaTarih(ILK_GUN) + " – " + kisaTarih(SON_GUN) : "–"],
     ["Gelecek", fs + " maç"]].forEach(([k, v]) => { const s = el("span"); s.append(k + ": ", el("b", null, v)); meta.append(s); });
    $("n-p").textContent = "";
    $("upd-durum").textContent = OLUSTURMA ? "Veri: " + new Date(OLUSTURMA).toLocaleString("tr-TR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
  }
  const gomulu = document.getElementById("gomulu-veri");
  async function guncelle(ilk) {
    const btn = $("guncelle"); btn.disabled = true; $("upd-durum").textContent = "Güncelleniyor…";
    try {
      let V;
      if (ilk && gomulu) V = JSON.parse(gomulu.textContent);
      else {
        const r = await fetch("veri.json?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        V = await r.json();
      }
      veriAc(V); onbellek.clear(); metaCiz();
      if (ilk && !FIK.some(m => m.gun >= bugun)) { gorunum = "p"; $("tab-g").setAttribute("aria-selected", "false"); $("tab-p").setAttribute("aria-selected", "true"); }
      if (ilk) hizliDoldur(); else if ($("f-hizli").value !== "ozel") hizliUygula($("f-hizli").value);
      listeHazirla(); btBaslat();
      if (!ilk) $("upd-durum").textContent += " · güncellendi";
    } catch (e) {
      metaCiz();
      $("upd-durum").textContent = gomulu
        ? "Bu önizlemede güncelleme yok; GitHub sayfanızda Güncelle tuşu son veriyi getirir."
        : "Güncellenemedi (" + (e && e.message || e) + "). İnternet bağlantınızı kontrol edin.";
      if (!TUM.length) ciz();
    } finally { btn.disabled = false; }
  }
  $("guncelle").addEventListener("click", () => guncelle(false));

  [
    "Adil oran*: Motorun benzer oranlı geçmiş maçlardan hesapladığı ihtimalin karşılığıdır (1 ÷ ihtimal). Hiçbir bahis şirketinin oranı değildir. İddaa'daki oran bu adil orandan yüksekse, o pazar motorun tahminine göre değerli görünür; düşükse değil. Gerçek oran sadece MS 1/X/2 ve 2,5 Alt/Üst için var (Bet365).",
    "Tahmini ihtimal: Toleransın iki katı genişlikteki tüm benzer maçlarda pazarın tutma oranı; az maç varsa ligin o tarihe kadarki ortalamasına doğru çekilir. \"Benzer maçlar\" sütunu ise en yakın maçlardaki sayıdır; sinyal buna göre verilir. Backtest, sinyallerin bu geniş gruptaki normalden fazla tutmadığını gösteriyor; tahmini ihtimal daha güvenilir ölçüdür.",
    "Kart: sarı + kırmızı kart sayısı; İddaa'nın kart kuralları farklı olabilir. Korner ve kart verisi her ligde yok. Veri: football-data.co.uk, her 4 saatte bir otomatik güncellenir. Bu sayfa istatistiksel bir analizdir, bahis tavsiyesi değildir."
  ].forEach(t => $("foot").append(el("p", null, t)));

  hizliDoldur();
  guncelle(true);
})();
</script>
