name: Verileri güncelle

on:
  schedule:
    - cron: "17 * * * *"      # her saat (UTC) - GitHub bunu bazen geciktirir
  workflow_dispatch:          # elle ya da dışarıdan (cron-job.org) tetiklemek için
  push:
    branches: [main]

permissions:
  contents: write             # biriken kupa/NBA verisini "veri" dalına kaydetmek için
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: NumPy kur (model hesapları için)
        run: pip install numpy || echo "NumPy kurulamadı; model değerleri sayfada hesaplanacak"

      - name: Önceki indirmeleri geri yükle
        uses: actions/cache@v4
        with:
          path: onbellek
          key: veri-${{ github.run_id }}
          restore-keys: veri-

      - name: Biriken veriyi getir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$URL" veri >/dev/null 2>&1; then
            git clone -q --depth 1 --branch veri "$URL" birikim
          else
            mkdir birikim && git -C birikim init -q -b veri && git -C birikim remote add origin "$URL"
          fi

      - name: Veriyi indir ve dönüştür
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          # Ana sayfa hangi sürüm olsun? v1.html = sinyalli eski sürüm (şu an ana sayfa), index.html = yeni model sürümü.
          # İki sürüm de her zaman v1.html ve v2.html adresinde durur.
          ANA_SAYFA: v1.html
        run: |
          mkdir -p _site
          python3 guncelle.py --onbellek onbellek --birikim birikim --cikti _site/veri.json
          cp index.html _site/v2.html
          cp v1.html _site/v1.html
          cp "$ANA_SAYFA" _site/index.html

      - name: Biriken veriyi kaydet
        run: |
          cd birikim
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Veri birikimi"
            git push -q origin HEAD:veri
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
