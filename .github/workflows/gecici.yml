name: Geçici veri indirme (analiz için, silinecek)
on:
  push:
    branches: [gecici-veri]
permissions:
  contents: write
jobs:
  indir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: football-data dosyalarını indir
        run: |
          mkdir -p onbellek
          K=https://www.football-data.co.uk
          curl -sSfL --retry 3 -A "Mozilla/5.0" -o onbellek/2627.zip $K/mmz4281/2627/data.zip
          curl -sSfL --retry 3 -A "Mozilla/5.0" -o onbellek/fixtures.csv $K/fixtures.csv || true
          curl -sSfL --retry 3 -A "Mozilla/5.0" -o onbellek/ek_fixtures.csv $K/new_league_fixtures.csv || true
          ls -la onbellek
      - name: Dala kaydet
        run: |
          git add onbellek
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Geçici veri" || exit 0
          git push -q origin HEAD:gecici-veri
