<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oran Bülteni">
<title>Oran Bülteni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Düzen: üstte başlık ve veri durumu; sekmeler (masaüstünde üstte, telefonda altta): Öneriler, Maçlar, Geçmiş, Performans.
   Maça dokununca ayrıntı paneli: öneriler + İddaa oranı, tüm pazarlar, oranları en çok benzeyen 10 maç. */
:root {
  --bg: #f3efe6; --surface: #fffcf6; --surface-2: #f7f3ea; --ink: #18201d; --muted: #66706a; --line: #e2dbcc;
  --accent: #0e6b55; --accent-ink: #ffffff; --accent-soft: #dcefe7; --gold: #a86a12; --gold-soft: #fbefd6;
  --hit: #13804c; --hit-soft: #e2f4ea; --miss: #c2412d; --miss-soft: #fbe7e2; --wait: #6b6f9a; --wait-soft: #ecedf7;
  --shadow: 0 1px 2px rgba(24, 32, 29, .06), 0 4px 14px rgba(24, 32, 29, .05);
  --f: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --m: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --nav-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121614; --surface: #1a1f1c; --surface-2: #202622; --ink: #e8ede9; --muted: #98a39c; --line: #2c3530;
  --accent: #4fc3a1; --accent-ink: #0d1411; --accent-soft: #173229; --gold: #e9b04f; --gold-soft: #3a2c12;
  --hit: #52c98d; --hit-soft: #15301f; --miss: #f08068; --miss-soft: #3a1c16; --wait: #a9add6; --wait-soft: #24263a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121614; --surface: #1a1f1c; --surface-2: #202622; --ink: #e8ede9; --muted: #98a39c; --line: #2c3530;
  --accent: #4fc3a1; --accent-ink: #0d1411; --accent-soft: #173229; --gold: #e9b04f; --gold-soft: #3a2c12;
  --hit: #52c98d; --hit-soft: #15301f; --miss: #f08068; --miss-soft: #3a1c16; --wait: #a9add6; --wait-soft: #24263a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f); }
button, input, select { font: inherit; color: inherit; }
.num { font-family: var(--m); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
a { color: var(--accent); }

/* üst bölüm */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.logo { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo b { font-size: 1.15rem; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; }
.logo i { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; flex: none; }
.logo i::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 3px solid var(--accent-ink); }
.durum { margin-left: auto; font-size: 12px; color: var(--muted); text-align: right; line-height: 1.3; }
.ikon-btn { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; height: 38px; padding: 0 12px; cursor: pointer; font-weight: 600; font-size: 13px; }
.ikon-btn[disabled] { opacity: .6; cursor: progress; }
.sekmeler { max-width: 1080px; margin: 0 auto; display: flex; gap: 4px; }
.sekmeler button { border: 0; background: none; padding: 10px 14px 12px; font-weight: 700; font-size: 14px; color: var(--muted); cursor: pointer; border-bottom: 2.5px solid transparent; }
.sekmeler button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.sekmeler button span, .alt-nav button span.say { font-family: var(--m); font-size: 11px; font-weight: 600; margin-left: 4px; color: var(--muted); }
.alt-nav { display: none; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { max-width: 1080px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); }
.gorunum { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-width: 0; }
.gorunum > * { min-width: 0; }
#oneri-liste, #mac-liste, #gecmis-liste { display: grid; gap: 14px; }
.baslik { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.baslik h1 { margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; }
.baslik p { margin: 0; color: var(--muted); font-size: 13px; }

/* filtre çipleri */
.cipler { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
.cipler::-webkit-scrollbar { display: none; }
.cip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; color: var(--ink); }
.cip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.cip.ayar { display: inline-flex; gap: 6px; align-items: center; }
.cip.ayar::before { content: ""; width: 12px; height: 10px; background: linear-gradient(currentColor, currentColor) 0 0 / 100% 2px no-repeat, linear-gradient(currentColor, currentColor) 0 4px / 70% 2px no-repeat, linear-gradient(currentColor, currentColor) 0 8px / 40% 2px no-repeat; }

/* özet kartı */
.ozet { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; box-shadow: var(--shadow); }
.ozet-ust { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end; }
.ozet-ust .kpi { display: grid; gap: 0; }
.kpi b { font-family: var(--m); font-size: 1.6rem; font-weight: 600; line-height: 1.1; letter-spacing: -.02em; }
.kpi small { font-size: 12px; color: var(--muted); }
.ozet p { margin: 0; font-size: 13px; color: var(--muted); }
.ozet p b { color: var(--ink); font-weight: 700; }

/* gün grupları ve maç kartları */
.gun { display: grid; gap: 8px; }
.gun h2 { margin: 6px 2px 0; font-size: 13px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.gun h2 .say { font-family: var(--m); font-weight: 600; text-transform: none; letter-spacing: 0; }
#oneri-hizli { flex-wrap: wrap; overflow: visible; }
tr.alt-satir td { color: var(--muted); }
tr.alt-satir td:first-child { padding-left: 24px; }
.kart { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.kart > button { all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer; padding: 12px 14px; }
.kart > button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 14px; }
.mac-ust { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.lig { font-weight: 700; font-size: 11px; letter-spacing: .03em; color: var(--accent); background: var(--accent-soft); border-radius: 5px; padding: 1px 6px; }
.saat { font-family: var(--m); font-weight: 600; color: var(--ink); }
.mac-ust .sag { margin-left: auto; font-family: var(--m); }
.takimlar { font-weight: 700; font-size: 15px; margin: 4px 0 0; overflow-wrap: anywhere; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.skor { font-family: var(--m); font-weight: 600; font-size: 14px; color: var(--muted); }
.rozet { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.rozet.bek { color: var(--wait); border-color: var(--wait); background: var(--wait-soft); }
.oneriler { display: grid; gap: 6px; margin-top: 10px; }
.oneri { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid transparent; }
.oneri .ad { font-weight: 700; font-size: 14px; min-width: 0; }
.oneri .ihtimal { font-family: var(--m); font-weight: 600; font-size: 1.2rem; text-align: right; grid-row: span 2; }
.oneri .alt { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.oneri .alt .adil { font-family: var(--m); }
.destek { color: var(--gold); background: var(--gold-soft); border-radius: 999px; padding: 0 7px; font-weight: 700; font-size: 11px; }
.oneri.tuttu { background: var(--hit-soft); border-color: var(--hit); }
.oneri.tutmadi { background: var(--miss-soft); border-color: var(--miss); }
.oneri .sonuc { font-weight: 800; font-size: 12px; }
.oneri.tuttu .sonuc { color: var(--hit); }
.oneri.tutmadi .sonuc { color: var(--miss); }
.oneri .deger.iyi { color: var(--hit); font-weight: 700; }
.oneri .deger.kotu { color: var(--miss); font-weight: 700; }
.oran-kutu { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
.ok { font-family: var(--m); font-size: 12px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 7px; padding: 2px 7px; display: inline-flex; gap: 5px; }
.ok small { color: var(--muted); font-family: var(--f); font-weight: 600; }
.ok.on { border-color: var(--accent); background: var(--accent-soft); }
.bos { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 22px; text-align: center; color: var(--muted); font-size: 14px; }
.daha { font-size: 12px; color: var(--muted); margin-top: 6px; }
.arama { display: flex; gap: 8px; flex-wrap: wrap; }
.arama input, .arama select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; font-size: 14px; min-width: 0; }
.arama input { flex: 1 1 180px; }

/* tablolar */
.tablo-kap { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow-x: auto; box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
caption { text-align: left; font-weight: 800; font-size: 13px; padding: 12px 12px 6px; }
th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-family: var(--m); font-variant-numeric: tabular-nums; }
tr.grp td { background: var(--surface-2); font-weight: 800; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
tr.vurgu td:first-child { box-shadow: inset 3px 0 0 var(--accent); font-weight: 700; }
tr.soluk td { color: var(--muted); }
.iyi { color: var(--hit); font-weight: 700; }
.kotu { color: var(--miss); font-weight: 700; }
.on-hucre { background: var(--accent-soft); color: var(--accent); font-weight: 700; border-radius: 4px; padding: 0 4px; }

/* bilgi metinleri */
.bilgi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; font-size: 14px; display: grid; gap: 8px; }
.bilgi h3 { margin: 0; font-size: 15px; font-weight: 800; }
.bilgi p, .bilgi ul { margin: 0; }
.bilgi ul { padding-left: 18px; display: grid; gap: 4px; }
.not { font-size: 12px; color: var(--muted); }

/* ayar ve ayrıntı panelleri */
.perde { position: fixed; inset: 0; background: rgba(10, 14, 12, .45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.panel { background: var(--bg); width: 100%; max-width: 760px; max-height: min(92vh, 92dvh); overflow-y: auto; border-radius: 18px 18px 0 0; padding: 0 0 calc(20px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -8px 30px rgba(0, 0, 0, .2); overscroll-behavior: contain; }
@media (min-width: 820px) { .perde { align-items: center; } .panel { border-radius: 18px; max-height: 88vh; } }
.panel-ust { position: sticky; top: 0; background: var(--bg); padding: 14px 16px 10px; display: flex; gap: 10px; align-items: flex-start; border-bottom: 1px solid var(--line); z-index: 2; }
.panel-ust h2 { margin: 0; font-size: 1.1rem; font-weight: 800; line-height: 1.3; }
.panel-ust .muted { font-size: 12px; }
.kapat { margin-left: auto; flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 18px; line-height: 1; }
.panel-ic { padding: 14px 16px; display: grid; gap: 14px; }
.panel-ic h3 { margin: 4px 0 0; font-size: 13px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.ayar-sat { display: grid; gap: 6px; }
.ayar-sat > span { font-weight: 700; font-size: 14px; }
.ayar-sat .cipler { flex-wrap: wrap; overflow: visible; }
.ayar-sat small { color: var(--muted); font-size: 12px; }
.anahtar { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; }
.anahtar input { width: 44px; height: 26px; accent-color: var(--accent); }
.oneri-kutu { display: grid; gap: 6px; padding-bottom: 6px; border-bottom: 1px dashed var(--line); }
.oneri-kutu:last-child { border-bottom: 0; }
.iddaa { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding-left: 10px; }
.iddaa input { width: 74px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; background: var(--surface); font-family: var(--m); font-size: 13px; text-align: right; }
.btn-ana { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 800; border-radius: 12px; padding: 12px 16px; cursor: pointer; }

@media (max-width: 720px) {
  .sekmeler { display: none; }
  .alt-nav { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line);
    padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  .alt-nav button { border: 0; background: none; height: var(--nav-h); display: grid; place-content: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .alt-nav button::before { content: ""; width: 22px; height: 4px; border-radius: 2px; margin: 0 auto 4px; background: transparent; }
  .alt-nav button[aria-selected="true"] { color: var(--ink); }
  .alt-nav button[aria-selected="true"]::before { background: var(--accent); }
  main { padding-bottom: calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px)); }
  .durum { font-size: 11px; }
  .logo b { font-size: 1.05rem; }
  .baslik h1 { font-size: 1.3rem; }
  .kpi b { font-size: 1.35rem; }
}
@media (prefers-reduced-motion: no-preference) { .panel { animation: yuk .18s ease-out; } @keyframes yuk { from { transform: translateY(16px); opacity: .6; } to { transform: none; opacity: 1; } } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="logo"><i aria-hidden="true"></i><b>Oran Bülteni</b></div>
    <div class="durum" id="durum">Veri yükleniyor…</div>
    <button class="ikon-btn" type="button" id="guncelle">Güncelle</button>
  </div>
  <nav class="sekmeler" role="tablist" aria-label="Bölümler" id="sekmeler">
    <button type="button" role="tab" data-s="oneri" aria-selected="true">Öneriler<span id="say-oneri"></span></button>
    <button type="button" role="tab" data-s="mac" aria-selected="false">Maçlar<span id="say-mac"></span></button>
    <button type="button" role="tab" data-s="gecmis" aria-selected="false">Geçmiş</button>
    <button type="button" role="tab" data-s="perf" aria-selected="false">Performans</button>
  </nav>
</header>

<main id="ana">
  <!-- ÖNERİLER -->
  <section id="s-oneri" class="gorunum" aria-label="Öneriler">
    <div class="baslik"><h1>Öneriler</h1><p id="oneri-alt"></p></div>
    <div class="cipler" id="oneri-gun" role="group" aria-label="Gün"></div>
    <div class="cipler" id="oneri-hizli" role="group" aria-label="Hızlı ayarlar"></div>
    <div class="ozet" id="oneri-ozet"></div>
    <div id="oneri-liste"></div>
  </section>

  <!-- MAÇLAR -->
  <section id="s-mac" class="gorunum" aria-label="Maçlar" hidden>
    <div class="baslik"><h1>Maçlar</h1><p id="mac-alt"></p></div>
    <div class="arama"><input id="mac-ara" type="search" placeholder="Takım ara" aria-label="Takım ara"><select id="mac-lig" aria-label="Lig"></select></div>
    <div id="mac-liste"></div>
  </section>

  <!-- GEÇMİŞ -->
  <section id="s-gecmis" class="gorunum" aria-label="Geçmiş" hidden>
    <div class="baslik"><h1>Geçmiş</h1><p>Son 14 günün önerileri, gerçek sonuçlarıyla</p></div>
    <div class="ozet" id="gecmis-ozet"></div>
    <div id="gecmis-liste"></div>
  </section>

  <!-- PERFORMANS -->
  <section id="s-perf" class="gorunum" aria-label="Performans" hidden>
    <div class="baslik"><h1>Performans</h1><p>Seçili ayarlarla, her maç yalnızca kendinden önceki bilgiyle</p></div>
    <div class="ozet" id="perf-ozet"></div>
    <div class="tablo-kap"><table id="perf-bant"></table></div>
    <div class="tablo-kap"><table id="perf-grup"></table></div>
    <div class="bilgi" id="formul"></div>
  </section>
</main>

<nav class="alt-nav" role="tablist" aria-label="Bölümler" id="alt-nav">
  <button type="button" role="tab" data-s="oneri" aria-selected="true">Öneriler</button>
  <button type="button" role="tab" data-s="mac" aria-selected="false">Maçlar</button>
  <button type="button" role="tab" data-s="gecmis" aria-selected="false">Geçmiş</button>
  <button type="button" role="tab" data-s="perf" aria-selected="false">Performans</button>
</nav>

<div class="perde" id="perde" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-baslik" id="panel">
    <div class="panel-ust"><div><h2 id="panel-baslik"></h2><div class="muted" id="panel-alt"></div></div><button class="kapat" type="button" id="kapat" aria-label="Kapat">×</button></div>
    <div class="panel-ic" id="panel-ic"></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  // ============================================================ yardımcılar
  const $ = id => document.getElementById(id);
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const v2 = x => x == null || !isFinite(x) ? "–" : Number(x).toFixed(2).replace(".", ",");
  const yz = x => x == null || !isFinite(x) ? "–" : "%" + Math.round(x * 100);
  const yz1 = x => x == null || !isFinite(x) ? "–" : "%" + (x * 100).toFixed(1).replace(".", ",");
  const binlik = x => Number(x).toLocaleString("tr-TR");
  const adil = p => p > 0 ? v2(1 / p) : "–";
  const al = (k, v) => { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : v; } catch (e) { return v; } };
  const yaz = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } };

  // ============================================================ tarih
  const GMS = 864e5;
  const gunNo = (y, m, d) => Math.round(Date.UTC(y, m - 1, d) / GMS);
  const BUGUN = (() => { const n = new Date(); return gunNo(n.getFullYear(), n.getMonth() + 1, n.getDate()); })();
  const tOf = g => new Date(g * GMS);
  const GUNLER = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
  const AYLAR = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
  const gunAd = g => { const d = tOf(g); const ek = g === BUGUN ? "Bugün · " : g === BUGUN + 1 ? "Yarın · " : g === BUGUN - 1 ? "Dün · " : ""; return ek + d.getUTCDate() + " " + AYLAR[d.getUTCMonth()] + " " + GUNLER[d.getUTCDay()]; };

    GRUPLAR.forEach(g => { const b = el("button", "cip", GRUP_KISA[g] || g); b.type = "button"; b.setAttribute("aria-pressed", String(A.gruplar.includes(g)));
      b.addEventListener("click", () => { const i = A.gruplar.indexOf(g); if (i >= 0) { if (A.gruplar.length > 1) A.gruplar.splice(i, 1); } else A.gruplar.push(g); ayarYaz(); b.setAttribute("aria-pressed", String(A.gruplar.includes(g))); ozetYenile(); });
      gc.append(b); });
    gs.append(gc); ic.push(gs);
    const an = el("label", "anahtar"); an.append("Sadece destekli öneriler"); const ck = el("input"); ck.type = "checkbox"; ck.checked = A.destek;
    ck.addEventListener("change", () => { A.destek = ck.checked; ayarYaz(); ozetYenile(); }); an.append(ck); ic.push(an);
    ozetYenile(); ic.push(oz);
    const tamam = el("button", "btn-ana", "Uygula"); tamam.type = "button"; tamam.addEventListener("click", panelKapat); ic.push(tamam);
    panelAc("Ayarlar", "Öneriler, Geçmiş ve Performans bu ayarlara göre", ic);
  }

  // ============================================================ sekmeler, çizim, güncelleme
  let SEKME = al("ob3-sekme", "oneri"); if (!["oneri", "mac", "gecmis", "perf"].includes(SEKME)) SEKME = "oneri";
  function sekmeSec(s) {
    SEKME = s; yaz("ob3-sekme", s);
    document.querySelectorAll("[data-s]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.s === s)));
    ["oneri", "mac", "gecmis", "perf"].forEach(k => { $("s-" + k).hidden = k !== s; });
    hepsiniCiz(); window.scrollTo(0, 0);
  }
  document.querySelectorAll("[data-s]").forEach(b => b.addEventListener("click", () => sekmeSec(b.dataset.s)));
  $("mac-ara").addEventListener("input", maclarCiz); $("mac-lig").addEventListener("change", maclarCiz);
  function hepsiniCiz() {
    if (!VERI) return;
    $("say-oneri").textContent = GELECEK.filter(m => m.gun >= BUGUN && secilenler(m).length).length || "";
    $("say-mac").textContent = GELECEK.filter(m => m.gun >= BUGUN).length || "";
    if (SEKME === "oneri") onerilerCiz(); else if (SEKME === "mac") maclarCiz(); else if (SEKME === "gecmis") gecmisCiz(); else perfCiz();
  }
  function durumCiz() {
    const d = $("durum"); d.textContent = "";
    const t = VERI && VERI.olusturma ? new Date(VERI.olusturma).toLocaleString("tr-TR", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "–";
    d.append(el("div", null, "Veri: " + t));
    d.append(el("div", null, "Aynı gün skor: " + (VERI && VERI.ayni_gun_sonuc ? "açık" : "kapalı")));
  }
  async function guncelle(ilk) {
    const b = $("guncelle"); b.disabled = true; if (!ilk) b.textContent = "…";
    try {
      const r = await fetch("veri.json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      veriAc(await r.json()); durumCiz(); ligSecenekleri(); formulCiz(); hepsiniCiz();
    } catch (e) {
      $("durum").textContent = "Veri alınamadı (" + (e && e.message || e) + ")";
      if (!VERI) $("oneri-liste").append(el("div", "bos", "Veri yüklenemedi. İnternet bağlantınızı kontrol edip Güncelle'ye basın."));
    } finally { b.disabled = false; b.textContent = "Güncelle"; }
  }
  $("guncelle").addEventListener("click", () => guncelle(false));
  sekmeSec(SEKME);
  guncelle(true);
})();
</script>
